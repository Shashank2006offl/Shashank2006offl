<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Shashank R, AI and ML engineer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d1f"/>
      <stop offset="0.55" stop-color="#0f1a3a"/>
      <stop offset="1" stop-color="#1b2552"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#6FFFE9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6FFFE9" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6FFFE9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9fb3d9" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>

  <!-- left text -->
  <text x="72" y="84" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" fill="#6FFFE9" letter-spacing="2">// AI / ML ENGINEER</text>
  <text x="70" y="168" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="76" font-weight="800" fill="url(#name)" letter-spacing="-2">Shashank R</text>
  <text x="72" y="214" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="24" fill="#c9d6ea">Systems that learn from structure, signal and language.</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#8fa3c0">
    <rect x="72" y="238" width="104" height="30" rx="15" fill="none" stroke="#3a506b"/>
    <text x="90" y="258">GNNs</text>
    <rect x="186" y="238" width="86" height="30" rx="15" fill="none" stroke="#3a506b"/>
    <text x="205" y="258">ViTs</text>
    <rect x="282" y="238" width="124" height="30" rx="15" fill="none" stroke="#3a506b"/>
    <text x="300" y="258">Retrieval</text>
    <rect x="416" y="238" width="104" height="30" rx="15" fill="none" stroke="#3a506b"/>
    <text x="436" y="258">Agents</text>
  </g>

  <!-- animated graph -->
  <g stroke="#6FFFE9" stroke-opacity="0.42" stroke-width="1.5" stroke-dasharray="4 7" fill="none">
    <line x1="840" y1="95"  x2="905" y2="185"><animate attributeName="stroke-dashoffset" from="0" to="-22" dur="2.2s" repeatCount="indefinite"/></line>
    <line x1="840" y1="95"  x2="975" y2="80"><animate attributeName="stroke-dashoffset" from="0" to="-22" dur="2.6s" repeatCount="indefinite"/></line>
    <line x1="905" y1="185" x2="975" y2="80"><animate attributeName="stroke-dashoffset" from="0" to="-22" dur="2s" repeatCount="indefinite"/></line>
    <line x1="975" y1="80"  x2="1040" y2="170"><animate attributeName="stroke-dashoffset" from="0" to="-22" dur="2.4s" repeatCount="indefinite"/></line>
    <line x1="905" y1="185" x2="1040" y2="170"><animate attributeName="stroke-dashoffset" from="0" to="-22" dur="2.8s" repeatCount="indefinite"/></line>
    <line x1="905" y1="185" x2="950" y2="265"><animate attributeName="stroke-dashoffset" from="0" to="-22" dur="2.1s" repeatCount="indefinite"/></line>
    <line x1="1040" y1="170" x2="950" y2="265"><animate attributeName="stroke-dashoffset" from="0" to="-22" dur="2.5s" repeatCount="indefinite"/></line>
    <line x1="1040" y1="170" x2="1110" y2="100"><animate attributeName="stroke-dashoffset" from="0" to="-22" dur="2.3s" repeatCount="indefinite"/></line>
    <line x1="975" y1="80"  x2="1110" y2="100"><animate attributeName="stroke-dashoffset" from="0" to="-22" dur="2.7s" repeatCount="indefinite"/></line>
    <line x1="1040" y1="170" x2="1120" y2="240"><animate attributeName="stroke-dashoffset" from="0" to="-22" dur="2.2s" repeatCount="indefinite"/></line>
    <line x1="950" y1="265" x2="1120" y2="240"><animate attributeName="stroke-dashoffset" from="0" to="-22" dur="2.9s" repeatCount="indefinite"/></line>
    <line x1="905" y1="185" x2="790" y2="230"><animate attributeName="stroke-dashoffset" from="0" to="-22" dur="2.4s" repeatCount="indefinite"/></line>
    <line x1="840" y1="95"  x2="790" y2="230"><animate attributeName="stroke-dashoffset" from="0" to="-22" dur="2.6s" repeatCount="indefinite"/></line>
    <line x1="950" y1="265" x2="790" y2="230"><animate attributeName="stroke-dashoffset" from="0" to="-22" dur="3s" repeatCount="indefinite"/></line>
  </g>

  <g>
    <!-- pulses -->
    <circle cx="840" cy="95" r="6" fill="none" stroke="#6FFFE9"><animate attributeName="r" values="6;20" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="170" r="6" fill="none" stroke="#b9a7ff"><animate attributeName="r" values="6;22" dur="3s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="3s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="265" r="6" fill="none" stroke="#6FFFE9"><animate attributeName="r" values="6;18" dur="3s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="3s" begin="2s" repeatCount="indefinite"/></circle>
    <!-- nodes -->
    <g fill="#0b132b" stroke-width="2">
      <circle cx="840" cy="95" r="7" stroke="#6FFFE9"/>
      <circle cx="905" cy="185" r="9" stroke="#6FFFE9"/>
      <circle cx="975" cy="80" r="7" stroke="#6FFFE9"/>
      <circle cx="1040" cy="170" r="11" stroke="#b9a7ff"/>
      <circle cx="950" cy="265" r="7" stroke="#6FFFE9"/>
      <circle cx="1110" cy="100" r="6" stroke="#6FFFE9"/>
      <circle cx="1120" cy="240" r="8" stroke="#b9a7ff"/>
      <circle cx="790" cy="230" r="6" stroke="#6FFFE9"/>
    </g>
    <circle cx="1040" cy="170" r="4" fill="#b9a7ff"/>
    <circle cx="905" cy="185" r="3.5" fill="#6FFFE9"/>
    <circle cx="1120" cy="240" r="3" fill="#b9a7ff"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>

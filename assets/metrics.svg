<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-label="Key results" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#6FFFE9"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6FFFE9"/>
      <stop offset="1" stop-color="#b9a7ff"/>
    </linearGradient>
  </defs>
  <style>
    .card{fill:#0f1a3a;stroke:#243460;stroke-width:1.2}
    .num{font:800 46px Inter,'Segoe UI',Helvetica,Arial,sans-serif;fill:url(#num);letter-spacing:-1px}
    .lbl{font:600 16px Inter,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e3ebf8}
    .sub{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8fa3c0}
  </style>

  <g>
    <rect class="card" x="1" y="1" width="283" height="168" rx="16"/>
    <rect x="24" y="22" width="40" height="4" rx="2" fill="url(#bar)"/>
    <text class="num" x="24" y="85">95.47%</text>
    <text class="lbl" x="24" y="116">GCN test accuracy</text>
    <text class="sub" x="24" y="141">respiratory sounds · 1,211 samples</text>
  </g>
  <g transform="translate(305 0)">
    <rect class="card" x="1" y="1" width="283" height="168" rx="16"/>
    <rect x="24" y="22" width="40" height="4" rx="2" fill="url(#bar)"/>
    <text class="num" x="24" y="85">0.943</text>
    <text class="lbl" x="24" y="116">Macro F1</text>
    <text class="sub" x="24" y="141">5-fold CV: 91.00% ± 1.32%</text>
  </g>
  <g transform="translate(610 0)">
    <rect class="card" x="1" y="1" width="283" height="168" rx="16"/>
    <rect x="24" y="22" width="40" height="4" rx="2" fill="url(#bar)"/>
    <text class="num" x="24" y="85">~99%</text>
    <text class="lbl" x="24" y="116">ViT test accuracy</text>
    <text class="sub" x="24" y="141">3D-print defects · 5 classes</text>
  </g>
  <g transform="translate(915 0)">
    <rect class="card" x="1" y="1" width="283" height="168" rx="16"/>
    <rect x="24" y="22" width="40" height="4" rx="2" fill="url(#bar)"/>
    <text class="num" x="24" y="85">1 + 2</text>
    <text class="lbl" x="24" y="116">Papers</text>
    <text class="sub" x="24" y="141">1 published · 2 in review</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
